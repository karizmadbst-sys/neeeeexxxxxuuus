<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>NEXUS ROYALE</title>
    <meta
      name="description"
      content="NEXUS ROYALE — 100 fighters... only one survivor. 3D Battle Royale built with TypeScript, Three.js, and WebGL."
    />
    <meta property="og:title" content="NEXUS ROYALE" />
    <meta
      property="og:description"
      content="100 fighters... only one survivor. Drop, gear up, and stay alive."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-[#070b14] text-slate-100 antialiased overflow-hidden select-none">
    <div id="app" class="fixed inset-0 w-full h-full overflow-hidden">
      <img
        id="lobby-bg"
        src="./assets/aistudio/Neon_Sky-Island_Fantasy_Lobby_23e86d51.png"
        alt=""
        aria-hidden="true"
        decoding="async"
        fetchpriority="high"
        referrerpolicy="no-referrer"
        style="display: none;"
        class="hidden absolute inset-0 z-0 w-full h-full object-cover object-center pointer-events-none select-none"
      />
      <div id="webgl-mount" class="absolute inset-0 z-10 w-full h-full"></div>
      <div id="ui-root" class="absolute inset-0 z-20 w-full h-full pointer-events-none"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
